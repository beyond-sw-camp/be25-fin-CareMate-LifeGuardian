name: Backend (Maven + Docker ECR) CICD to AWS EC2

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**' # backend 폴더 내부가 변경될 때만 배포가 실행됨

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./backend

    steps:
      # 1. 소스 코드 가져오기
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Java 실행 환경 세팅 (Java 21 기준)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # 3. Maven 빌드 (.jar 생성, 테스트 생략)
      - name: Build jar with Maven
        run: mvn clean package -DskipTests

      # 4. AWS 자격 증명 세팅 (GitHub Secrets 기반)
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # 5. AWS ECR 서비스 로그인 (LifeGuardianBackendEcrPushPolicy 권한 사용)
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 6. 도커 이미지 빌드 및 ECR 푸시
      # 이미지 태그는 배포 추적이 용이하도록 고유한 GitHub 커밋 샤(SHA)값과 latest를 동시에 부여합니다.
      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: lifeguardian # 정책에 선언된 ecr 레포지토리 이름
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      # 7. EC2 원격 접속 후 새 컨테이너 실행 스크립트 가동
      - name: Execute Remote SSH Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            cd /home/ubuntu/backend
            chmod +x deploy.sh
            ./deploy.sh
