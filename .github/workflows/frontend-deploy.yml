name: Frontend (Vue) CICD to AWS S3 & CloudFront

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**' # ◀ frontend 폴더 내부가 변경될 때만 이 파이프라인 트리거

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend # ◀ 모든 쉘 명령어를 frontend 폴더 안에서 실행

    steps:
      # 1. GitHub 저장소 소스 코드 체크아웃
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Node.js 환경 세팅 (Vue 프로젝트 버전에 맞춰 선택, 보통 18 또는 20 권장)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm' # npm 의존성 캐싱으로 빌드 속도 향상
          cache-dependency-path: 'frontend/package-lock.json'

      # 3. AWS 자격 증명 세팅 (SSM 조회를 위해 빌드 단계 앞으로 이동)
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # 4. AWS SSM Parameter Store에서 환경 변수 조회하여 .env.production 파일 생성
      - name: Fetch Environment Variables from SSM
        run: |
          VITE_FAVICON_URL=$(aws ssm get-parameter --name "/config/lifeguardian/prod/VITE_FAVICON_URL" --query "Parameter.Value" --output text)
          echo "VITE_FAVICON_URL=$VITE_FAVICON_URL" > .env.production

      # 5. 라이브러리 설치 및 Vue 정적 파일 컴파일 진행 (생성된 .env.production 적용)
      - name: Install dependencies and Build Vue app
        run: |
          npm ci
          npm run build

      # 6. S3 버킷으로 빌드된 Vue 정적 파일 동기화
      - name: Deploy to Amazon S3
        run: |
          aws s3 sync dist/ s3://${{ secrets.AWS_S3_BUCKET_NAME }} --delete

      # 7. CloudFront 캐시 무효화 (Invalidation)
      - name: CloudFront Invalidation
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"
