name: AI (Python) Deployment to AWS EC2

on:
  push:
    branches:
      - main
    paths:
      - 'ai/**' # ai 폴더 내부의 코드가 변경되었을 때만 이 파이프라인 작동

jobs:
  deploy-ai:
    runs-on: ubuntu-latest

    steps:
      # 1. 소스 코드 가져오기
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. AWS 자격 증명 세팅 (GitHub Secrets 기반)
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # 3. AWS SSM을 통해 Auto Scaling Group 내 인스턴스들에 순차 배포 명령 전송 (Git Pull 및 재기동)
      - name: Deploy AI on EC2 ASG via AWS SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --targets "Key=tag:aws:autoscaling:groupName,Values=${{ secrets.AWS_ASG_NAME }}" \
            --max-concurrency "1" \
            --max-errors "0" \
            --document-name "AWS-RunShellScript" \
            --parameters '{"commands":["cd /home/ubuntu/recommend_lambda", "git pull origin main", "chmod +x deploy.sh", "./deploy.sh"]}' \
            --query "Command.CommandId" \
            --output text)
          
          echo "SSM Command Sent to ASG. Command ID: $COMMAND_ID"
          
          # 모든 대상 인스턴스에서 명령 실행 완료 시까지 대기 (폴링 루프)
          echo "Waiting for SSM command to complete..."
          while true; do
            STATUS=$(aws ssm get-command \
              --command-id "$COMMAND_ID" \
              --query "Command.Status" \
              --output text)
            
            echo "Current Status: $STATUS"
            
            if [ "$STATUS" = "Success" ]; then
              echo "SSM Command completed successfully."
              break
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              echo "Error: SSM Command failed with status: $STATUS"
              exit 1
            fi
            
            sleep 10
          done
