name: Backend (Maven + Docker ECR) CICD to AWS EC2

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**' # backend 폴더 내부가 변경될 때만 배포가 실행됨

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./backend

    steps:
      # 1. 소스 코드 가져오기
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. pom.xml에서 버전명 추출 후 GitHub run_number와 조합하여 고유 버전 생성
      # 예: pom.xml의 0.0.1-SNAPSHOT ➔ 0.0.1-15 (15번째 빌드)
      - name: Generate Semantic Build Version
        id: versioning
        run: |
          RAW_VERSION=$(grep -oPm1 '(?<=<version>)[^<]+' pom.xml | sed 's/-SNAPSHOT//')
          BUILD_VERSION="${RAW_VERSION}-${{ github.run_number }}"
          echo "build_version=$BUILD_VERSION" >> $GITHUB_OUTPUT

      # 3. Java 실행 환경 세팅 (Java 21 기준)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # 4. Maven 빌드 (.jar 생성, 테스트 생략)
      - name: Build jar with Maven
        run: mvn clean package -DskipTests

      # 5. AWS 자격 증명 세팅 (GitHub Secrets 기반)
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # 6. AWS ECR 서비스 로그인 (LifeGuardianBackendEcrPushPolicy 권한 사용)
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 7. 도커 이미지 빌드 및 ECR 푸시 (고유 빌드 버전 태그와 latest 태그 동시 적용)
      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: lifeguardian
          IMAGE_TAG: ${{ steps.versioning.outputs.build_version }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      # 8. AWS SSM을 통해 Auto Scaling Group 내 모든 인스턴스에 순차적으로 배포 명령 전송 (무중단 롤링)
      - name: Deploy on EC2 ASG via AWS SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --targets "Key=tag:aws:autoscaling:groupName,Values=${{ secrets.AWS_ASG_NAME }}" \
            --max-concurrency "1" \
            --max-errors "0" \
            --document-name "AWS-RunShellScript" \
            --parameters '{"commands":["cd /home/ubuntu/backend", "chmod +x deploy.sh", "./deploy.sh ${{ steps.versioning.outputs.build_version }}"]}' \
            --query "Command.CommandId" \
            --output text)
          
          echo "SSM Command Sent to ASG. Command ID: $COMMAND_ID. Version: ${{ steps.versioning.outputs.build_version }}"
          
          # 모든 대상 인스턴스에서 명령 실행 완료 시까지 대기 (폴링 루프)
          echo "Waiting for SSM command to complete..."
          while true; do
            STATUS=$(aws ssm get-command \
              --command-id "$COMMAND_ID" \
              --query "Command.Status" \
              --output text)
            
            echo "Current Status: $STATUS"
            
            if [ "$STATUS" = "Success" ]; then
              echo "SSM Command completed successfully."
              break
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              echo "Error: SSM Command failed with status: $STATUS"
              exit 1
            fi
            
            sleep 10
          done
